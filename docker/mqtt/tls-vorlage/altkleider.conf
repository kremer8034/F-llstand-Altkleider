# ---------------------------------------------------------------------------
# Verschlüsselter MQTT-Zugang für Geräte aus dem Mobilfunknetz.
#
# Vorlage: start.sh kopiert diese Datei nur dann in das eingelesene
# Verzeichnis, wenn das Zertifikat wirklich lesbar ist. Fehlt es und stünde der
# Block trotzdem in der Konfiguration, verweigerte Mosquitto den Start - und
# dann käme kein einziger Messwert mehr an, auch nicht über 1883.
#
# Das Zertifikat ist dasselbe wie das der Web-Oberfläche (Let's Encrypt,
# altkleider.tech). Es wird schreibgeschützt aus docker/gateway/zertifikate
# eingehängt; start.sh legt daraus eine Kopie unter /tmp/zertifikat an, die
# dem Broker gehört (certbots Dateien gehören root und sind für den Benutzer
# "mosquitto" nicht lesbar). Nach einer Erneuerung genügt
# `docker compose restart mqtt`.
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt

# Der Ausweis des Servers gegenüber dem Gerät (Let's Encrypt).
certfile /tmp/zertifikat/fullchain.pem
keyfile  /tmp/zertifikat/privkey.pem

# Die CA, gegen die der Broker die Ausweise der GERÄTE prüft - unsere eigene,
# aus scripts/geraete-zertifikate.sh. Das ist nicht dieselbe wie oben: dort
# weist sich der Server aus, hier das Gerät.
cafile /tmp/zertifikat/geraete-ca.pem

# Die Sperrliste. Jedes Gerät hat einen eigenen Ausweis; wird eines gestohlen,
# kommt seine Nummer hier hinein (scripts/geraet-sperren.sh) und der Broker
# lässt genau dieses eine nicht mehr herein - ohne dass die übrigen neu
# eingestellt werden müssen.
#
# Achtung: eine Sperrliste hat selbst ein Ablaufdatum, und eine abgelaufene
# lässt den Broker JEDES Gerät ablehnen. Deshalb wird sie mit hundert Jahren
# Laufzeit ausgestellt (default_crl_days in geraete-ca/openssl.cnf).
crlfile /tmp/zertifikat/geraete-crl.pem

# TLS 1.2 als Untergrenze. Ältere Fassungen gelten als gebrochen, und die
# NB-IoT-Module von Milesight und Dragino sprechen mindestens 1.2.
tls_version tlsv1.2

# Ohne gültiges Client-Zertifikat kommt auf 8883 niemand herein.
#
# Das war zunächst anders geplant - bis sich zeigte, dass die ToolBox-App bei
# eingeschaltetem TLS ohnehin eines verlangt ("This field is required"). Wenn
# das Gerät eines mitbringen muss, soll es auch geprüft werden; sonst hätte
# man den Aufwand ohne den Nutzen.
#
# Benutzername und Passwort gelten weiter: use_identity_as_username bleibt
# aus, der Ausweis ersetzt die Anmeldung also nicht, er kommt davor.
require_certificate true

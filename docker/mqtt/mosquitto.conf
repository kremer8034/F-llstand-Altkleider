# ---------------------------------------------------------------------------
# MQTT-Broker (Mosquitto) – Annahmeweg für Sensoren, die MQTT sprechen
#
# Gedacht für "Weg B" aus docs/sensor-entscheidung.md: Dragino DDS75 und
# Milesight EM400 schicken ihre Messwerte an einen eigenen Broker statt an die
# Wolke des Herstellers. Jedes Gerät weist sich mit eigenem Benutzernamen und
# Passwort aus – dieselbe Logik wie die Gerätegeheimnisse der Bastellösung.
#
# Die Benutzerliste steht NICHT in dieser Datei. Sie wird bei jedem Start aus
# den MQTT_*-Werten der .env erzeugt (docker/mqtt/start.sh), damit Zugangsdaten
# an einer einzigen Stelle liegen und nicht im Repository landen.
# ---------------------------------------------------------------------------

# --- Was der Broker über Neustarts hinweg behält --------------------------
# Gemerkte Sitzungen und noch nicht zugestellte Nachrichten überleben einen
# Neustart. Wichtig für Geräte, die nur viermal am Tag senden.
persistence true
persistence_location /mosquitto/data/

# Protokoll nach stdout, damit `docker compose logs mqtt` es zeigt.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Zugang ---------------------------------------------------------------
# Kein anonymer Zugriff. Wer schreiben oder mitlesen will, braucht ein Konto.
allow_anonymous false
password_file /mosquitto/config/passwort

# Themenrechte. Ohne sie darf jedes angemeldete Konto alles - auch alle
# fremden Meldungen mitlesen. Die Datei entsteht bei jedem Start neu
# (docker/mqtt/start.sh):
#
#   Sensoren    dürfen unter sensoren/… schreiben, aber nichts lesen
#   die Brücke  darf lesen, aber nicht schreiben
#
# Erst dadurch bringt ein eigenes Konto je Gerät überhaupt etwas. Solange
# jedes Konto alles darf, ist es nur Buchhaltung.
acl_file /tmp/rechte

# --- Klartext (nur im eigenen Netz!) --------------------------------------
# Port 1883 überträgt unverschlüsselt. Er ist für die Brücke im Nachbar-
# container gedacht und für die Fehlersuche auf dem Server selbst.
#
# Geräte, die über das Mobilfunknetz hereinkommen, gehören auf 8883 – sonst
# reisen Benutzername und Passwort im Klartext durchs Internet. Siehe
# docs/mqtt.md, Abschnitt "Verschlüsselung".
listener 1883
protocol mqtt

# --- Verschlüsselt (für Geräte aus dem Mobilfunknetz) ---------------------
# Dasselbe Zertifikat wie die Web-Oberfläche: Let's Encrypt für
# altkleider.tech, eingehängt aus docker/gateway/zertifikate. Damit prüft der
# Sensor die Gegenstelle gegen die üblichen Wurzelzertifikate – kein eigenes
# CA-Zertifikat, das ins Gerät müsste.
#
# Läuft dieser Block ins Leere (Zertifikat noch nicht ausgestellt), verweigert
# Mosquitto den Start. Deshalb liegt er in einer eigenen Datei, die nur
# eingebunden wird, wenn die .pem-Dateien wirklich da sind – dieselbe Logik
# wie beim Torwächter (docker/gateway/tls/).
# Das Verzeichnis füllt start.sh - siehe dort.
include_dir /tmp/tls

# --- WebSockets -----------------------------------------------------------
# Für Browser-Werkzeuge und Fehlersuche (z. B. MQTT Explorer im Web).
listener 9001
protocol websockets

# Keine Obergrenze fuer das Keepalive.
#
# Hier stand `max_keepalive 3600` mit der Begruendung, Geraete duerften die
# Verbindung lange offen halten. Die Option tut das Gegenteil: sie ist eine
# OBERGRENZE. Ein MQTT-3.1.1-Client, der mehr verlangt, bekommt kein "zu lang",
# sondern ein CONNACK mit "identifier rejected" - und ein Keepalive von 0
# ("gar keine Ueberwachung") zaehlt als unendlich und damit als zu viel.
#
# Genau daran scheiterte der Milesight EM400-MUD: er meldet sich mit k0. Die
# Anmeldung gelang, danach wies der Broker ihn ab - mit einem Code, der nach
# einem Problem mit der Client-Kennung aussieht und keines war.
#
# 0 heisst: keine Obergrenze. Fuer Geraete, die alle paar Minuten aufwachen und
# die Verbindung sofort wieder schliessen, ist ein Keepalive ohnehin ohne
# Nutzen - tot erkannt werden sie ueber max_stille_stunden, nicht ueber MQTT.
max_keepalive 0

# Eine einzelne Nutzlast eines Füllstandssensors ist ein paar hundert Byte.
# 64 KB sind großzügig und begrenzen zugleich den Schaden bei Fehlkonfiguration.
max_packet_size 65536

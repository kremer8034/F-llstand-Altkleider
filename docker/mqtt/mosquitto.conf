# ---------------------------------------------------------------------------
# MQTT-Broker (Mosquitto) – Annahmeweg für Sensoren, die MQTT sprechen
#
# Gedacht für "Weg B" aus docs/sensor-entscheidung.md: Dragino DDS75 und
# Milesight EM400 schicken ihre Messwerte an einen eigenen Broker statt an die
# Wolke des Herstellers. Jedes Gerät weist sich mit eigenem Benutzernamen und
# Passwort aus – dieselbe Logik wie die Gerätegeheimnisse der Bastellösung.
#
# Die Benutzerliste steht NICHT in dieser Datei. Sie wird bei jedem Start aus
# den MQTT_*-Werten der .env erzeugt (docker/mqtt/start.sh), damit Zugangsdaten
# an einer einzigen Stelle liegen und nicht im Repository landen.
# ---------------------------------------------------------------------------

# --- Was der Broker über Neustarts hinweg behält --------------------------
# Gemerkte Sitzungen und noch nicht zugestellte Nachrichten überleben einen
# Neustart. Wichtig für Geräte, die nur viermal am Tag senden.
persistence true
persistence_location /mosquitto/data/

# Protokoll nach stdout, damit `docker compose logs mqtt` es zeigt.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Zugang ---------------------------------------------------------------
# Kein anonymer Zugriff. Wer schreiben oder mitlesen will, braucht ein Konto.
allow_anonymous false
password_file /mosquitto/config/passwort

# --- Klartext (nur im eigenen Netz!) --------------------------------------
# Port 1883 überträgt unverschlüsselt. Solange der Broker nur im Hausnetz
# erreichbar ist, ist das vertretbar. Sobald Geräte über das Mobilfunknetz
# hereinkommen, gehört davor TLS – siehe Abschnitt "Verschlüsselung" in
# docs/mqtt.md.
listener 1883
protocol mqtt

# --- WebSockets -----------------------------------------------------------
# Für Browser-Werkzeuge und Fehlersuche (z. B. MQTT Explorer im Web).
listener 9001
protocol websockets

# Geräte, die selten senden, halten die Verbindung lange offen.
max_keepalive 3600

# Eine einzelne Nutzlast eines Füllstandssensors ist ein paar hundert Byte.
# 64 KB sind großzügig und begrenzen zugleich den Schaden bei Fehlkonfiguration.
max_packet_size 65536

# ---------------------------------------------------------------------------
# Mosquitto - der Briefkasten für die Sensoren
#
# Der Milesight EM400 spricht kein HTTP (docs/em400-tld.md). Er veröffentlicht
# seine Messungen auf einem MQTT-Broker; von dort holt die Brücke sie ab und
# reicht sie an /api/ingest/webhook weiter.
#
# Zwei Entscheidungen stecken in dieser Datei:
#
#   1. KEINE anonymen Verbindungen. Ein offener Broker im Internet ist binnen
#      Stunden gefunden - und wer darauf veröffentlichen darf, kann Füllstände
#      erfinden. Jedes Gerät bekommt Benutzernamen und Passwort
#      (scripts/mqtt-geraet-anlegen.sh).
#
#   2. Die Rechte hängen am Benutzernamen, nicht am Vertrauen. Die acl-Datei
#      erlaubt jedem Gerät ausschließlich sein eigenes Thema. Ohne das könnte
#      Gerät A Messungen im Namen von Gerät B einreichen, und niemand würde
#      es merken - die Meldung sähe völlig richtig aus.
# ---------------------------------------------------------------------------

persistence true
persistence_location /mosquitto/data/

# Ins Protokoll des Containers, damit `docker compose logs mosquitto` alles
# zeigt. Eine eigene Datei wäre ein zweiter Ort zum Nachsehen.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

allow_anonymous false
# Im beschreibbaren Volume: hierhin schreibt scripts/mqtt-geraet-anlegen.sh.
password_file /mosquitto/config/zugaenge/passwd
acl_file /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Unverschlüsselt - nur für den ersten Versuch
#
# ACHTUNG: auf diesem Zugang wandert das Gerätepasswort im Klartext über das
# Mobilfunknetz. Für einen Test am Schreibtisch ist das vertretbar, für den
# Dauerbetrieb nicht. Sobald ein Zertifikat vorliegt, gehört der verschlüsselte
# Zugang daneben (conf.d/tls.conf.beispiel) und dieser Port hinter die
# Hausfirewall - oder ganz zu.
# ---------------------------------------------------------------------------
listener 1883
protocol mqtt

# Alles Weitere kommt aus conf.d - dort liegt der verschlüsselte Zugang, sobald
# er eingerichtet ist. Ein Verzeichnis statt einer auskommentierten Passage:
# so bleibt diese Datei unverändert, wenn TLS dazukommt, und der Unterschied
# zwischen "eingerichtet" und "nicht eingerichtet" ist eine vorhandene Datei
# statt eines entfernten Rautezeichens.
include_dir /mosquitto/config/conf.d

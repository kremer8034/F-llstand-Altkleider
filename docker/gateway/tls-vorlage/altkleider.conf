# ---------------------------------------------------------------------------
# Verschlüsselter Zugang unter der eigenen Adresse.
#
# Diese Datei liegt bewusst in "tls-vorlage" und nicht in "tls": eingebunden
# wird sie erst, wenn das Zertifikat tatsächlich existiert. Fehlen die beiden
# .pem-Dateien, verweigert nginx den Start - und mit ihm die ganze Anwendung.
#
# In Betrieb nehmen (einmalig, siehe docs/docker.md):
#   cp docker/gateway/tls-vorlage/altkleider.conf docker/gateway/tls/
#   docker compose exec gateway nginx -s reload
# ---------------------------------------------------------------------------

# Die Anwendung soll unter genau einer Adresse leben. Das Zertifikat deckt
# beide ab, aber Anmeldesitzungen hängen am Namen: wer sich unter "www"
# anmeldet, hätte seine Sitzung auf der falschen Adresse. Deshalb führt "www"
# zurück auf die kurze Form.
server {
    listen 443 ssl;
    http2 on;
    server_name www.altkleider.tech;

    ssl_certificate     /etc/letsencrypt/live/altkleider.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altkleider.tech/privkey.pem;

    return 301 https://altkleider.tech$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name altkleider.tech;

    ssl_certificate     /etc/letsencrypt/live/altkleider.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altkleider.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sagt dem Browser, diese Adresse künftig nur noch verschlüsselt
    # anzusprechen. Wirksam, aber eine Festlegung: Browser merken sich das ein
    # Jahr lang, ein Rückweg auf reines HTTP ist dann nicht mehr möglich.
    # Erst einschalten, wenn HTTPS zuverlässig läuft.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Anmeldung, Einladungen, Passwort zurücksetzen
    location ~ ^/auth/v1/(.*)$ {
        set $ziel_auth auth:9999;
        proxy_pass http://$ziel_auth/$1$is_args$args;
    }

    # Datenzugriff. Der eigentliche Schutz sitzt in den Zugriffsregeln der
    # Datenbank, nicht hier.
    location ~ ^/rest/v1/(.*)$ {
        set $ziel_rest rest:3000;
        proxy_pass http://$ziel_rest/$1$is_args$args;
    }

    location / {
        set $ziel_app app:3000;
        proxy_pass http://$ziel_app$request_uri;
        proxy_read_timeout 60s;
    }
}

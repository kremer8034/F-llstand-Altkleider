# ---------------------------------------------------------------------------
# Ein Einstiegspunkt für alles: Web-Oberfläche und Supabase-Schnittstelle
# liegen auf derselben Adresse. Das erspart CORS-Regeln, einen zweiten Port
# und ein zweites Zertifikat.
#
#   /auth/v1/…  → Anmeldeverwaltung   (auth)
#   /rest/v1/…  → Datenschnittstelle  (rest)
#   alles Übrige → Web-Anwendung      (app)
#
# Die Ziele stehen absichtlich in Variablen: nur so fragt nginx den
# Docker-Namensdienst bei jeder Anfrage neu. Ohne das merkt sich nginx die
# IP-Adresse beim Start – und liefert nach einem `docker compose up --build`
# so lange Fehler 502, bis man den Torwächter selbst neu startet.
# ---------------------------------------------------------------------------

# Der verschlüsselte Zugang liegt in einer eigenen Datei, die erst dazukommt,
# wenn ein Zertifikat vorhanden ist. Solange das Verzeichnis leer ist, läuft
# alles unverschlüsselt über Port 80 - nginx startet in beiden Fällen.
include /etc/nginx/tls/*.conf;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Die Nachweisdateien, mit denen Let's Encrypt prüft, ob uns diese Adresse
    # gehört. Muss unverschlüsselt erreichbar bleiben, auch später - sonst
    # scheitert jede Erneuerung. "^~" schlägt die Regelausdrücke weiter unten.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Die Innenprüfung des Containers fragt hier an und darf deshalb nicht
    # umgeleitet werden: sie kennt weder die äußere Adresse noch das
    # Zertifikat.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Alles Übrige verschlüsselt weiterführen. Das Ziel steht fest verdrahtet
    # und nicht als $host, damit ein Aufruf über die nackte IP-Adresse nicht in
    # einer Zertifikatswarnung endet.
    #
    # Achtung: Diese Umleitung setzt voraus, dass der 443-Block eingebunden ist
    # (siehe docker/gateway/tls/). Fehlt das Zertifikat, ist die Anwendung
    # hierüber nicht mehr erreichbar.
    location / {
        return 301 https://altkleider.tech$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Der Weg von innen: Container zu Container.
#
# Der Block oben leitet alles auf HTTPS um. Für Anfragen von außen ist das
# richtig - für die Anwendung im Nachbarcontainer ist es eine Sackgasse: sie
# folgt der Umleitung auf https://altkleider.tech, und dieser Name führt aus
# dem Docker-Netz heraus ins Leere (127.0.1.1, Verbindung abgelehnt). Der
# Server bekam deshalb nie eine Antwort von der Anmeldeverwaltung und hielt
# jeden für abgemeldet - der interne Bereich schickte sofort zurück zur
# Anmeldeseite, obwohl die Anmeldung selbst geklappt hatte.
#
# Deshalb dieser zweite Eingang, unverschlüsselt und ohne Umleitung. Port 8081
# steht in docker-compose.yml NICHT unter "ports": er ist nur innerhalb des
# Docker-Netzes erreichbar. Wer ihn nach außen öffnet, gibt Zugangsdaten im
# Klartext preis.
# ---------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Die Anwendung soll ihre Links weiter mit https bilden - dass es innen
    # über einen unverschlüsselten Nebeneingang geht, ist eine Interna.
    proxy_set_header X-Forwarded-Proto https;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Anmeldung, Einladungen, Passwort zurücksetzen
    location ~ ^/auth/v1/(.*)$ {
        set $ziel_auth auth:9999;
        proxy_pass http://$ziel_auth/$1$is_args$args;
    }

    # Datenzugriff. Der eigentliche Schutz sitzt in den Zugriffsregeln der
    # Datenbank, nicht hier.
    location ~ ^/rest/v1/(.*)$ {
        set $ziel_rest rest:3000;
        proxy_pass http://$ziel_rest/$1$is_args$args;
    }

    # Für den stündlichen Prüflauf, der die Anwendung selbst aufruft.
    location / {
        set $ziel_app app:3000;
        proxy_pass http://$ziel_app$request_uri;
        proxy_read_timeout 60s;
    }
}

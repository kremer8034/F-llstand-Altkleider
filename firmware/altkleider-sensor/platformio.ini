; ---------------------------------------------------------------------------
; Fuellstandsensor Altkleidercontainer
;
; Zielplatine: LilyGO T-SIM7080G-S3 (ESP32-S3 + SIM7080G, Cat-M / NB-IoT)
; Sensor:      DFRobot A02YYUW (wasserdichter Ultraschallsensor, UART)
;
;   pio run                  bauen
;   pio run -t upload        flashen
;   pio device monitor       Ausgabe mitlesen
; ---------------------------------------------------------------------------
[env:t-sim7080g-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 80000000L        ; 80 MHz reicht und spart Strom
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DTINY_GSM_MODEM_SIM7080
    -DTINY_GSM_RX_BUFFER=1024
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    vshymanskyy/TinyGSM@^0.12.0
    vshymanskyy/StreamDebugger@^1.0.1
    arduino-libraries/ArduinoHttpClient@^0.6.1
